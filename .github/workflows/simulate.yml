name: Alarm Simulation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

# Cancel any queued run of the same workflow. GitHub cron scheduling is
# unpredictable and can queue multiple runs; without this, a backlog of
# stacked jobs burns quota all at once when the runner becomes available.
concurrency:
  group: simulate
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      - name: Run simulation
        # --min/--max: 45–90 s per tick. ~4 ticks per 4.5-min run vs ~12 at 15–30 s.
        # Each tick writes to topology, which triggers onSnapshot on all connected
        # clients. 4 writes × 288 runs = 1,152 topology updates/day (vs 3,456).
        # Combined with the topology read cache in simulate.ts, total daily reads
        # stay well under the 50 k Firestore free-tier limit.
        run: yarn tsx scripts/simulate.ts --duration=270000 --min=45000 --max=90000
        timeout-minutes: 5
